name: Verify Body Quest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/energy-browser.mjs
      - run: node tests/outlook-browser.mjs
      - run: node tests/access-browser.mjs
      - run: node tests/quick-browser.mjs
      - run: node tests/home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-verification
          path: test-artifacts
          if-no-files-found: ignore
